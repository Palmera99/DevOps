name: DevOps CI Pipeline - SaludConecta

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-build:
    name: Lint, Build & Verify Container
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código Fuente (Checkout)
        uses: actions/checkout@v4

      - name: Validar Estructura de Archivos Obligatorios
        run: |
          echo "=== Verificando archivos requeridos por la pauta ==="
          test -f Dockerfile || { echo "Falta Dockerfile"; exit 1; }
          test -f docker-compose.yml || { echo "Falta docker-compose.yml"; exit 1; }
          test -f .env.example || { echo "Falta .env.example"; exit 1; }
          test -f .gitignore || { echo "Falta .gitignore"; exit 1; }
          test -f README.md || { echo "Falta README.md"; exit 1; }
          test -f src/index.html || { echo "Falta src/index.html"; exit 1; }
          test -f src/styles.css || { echo "Falta src/styles.css"; exit 1; }
          echo "Todos los archivos requeridos están presentes."

      - name: Validar Seguridad (No exponer .env con datos reales)
        run: |
          if [ -f .env ]; then
            echo "ALERTA: Se detectó un archivo .env en el repositorio. Debe ser ignorado por .gitignore";
            exit 1;
          fi
          echo "Validación de seguridad superada: Sin archivos .env expuestos."

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir Imagen Docker
        run: |
          docker build -t saludconecta-web:ci .

      - name: Probar Ejecución del Contenedor
        run: |
          docker run -d --name test-container -p 8080:80 saludconecta-web:ci
          sleep 3
          curl --fail http://localhost:8080 || { echo "Servicio no responde en puerto 8080"; exit 1; }
          echo "Servicio Nginx respondiendo correctamente código HTTP 200"
          docker stop test-container
          docker rm test-container
