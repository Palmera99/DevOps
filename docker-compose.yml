services:
  web-reserva-medica:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saludconecta-web
    image: saludconecta-web:1.0.0
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    environment:
      - NODE_ENV=${APP_ENV:-production}
      - VIRTUAL_PORT=80
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          cpus: '0.10'
          memory: 32M
    networks:
      - devops-network

networks:
  devops-network:
    driver: bridge
